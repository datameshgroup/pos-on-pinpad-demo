plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 32

    defaultConfig {
        applicationId "au.com.dmg.terminalposdemo"
        minSdk 21
        targetSdk 32
        versionCode 1

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi'
        }

        packagingOptions {
            jniLibs {
                useLegacyPackaging true
            }
        }
    }

    flavorDimensions 'device'

    ext {
        deviceVersions = [:]
    }

    productFlavors {

        def versionFormat = "${rootProject.ext.major_version}"
        def apkName = rootProject.ext.apk_name

        def createDeviceFlavor = { device ->
            "${device}" {
                dimension "device"

                resValue "string", "device_version", "${device}"

                def deviceVersion = "${versionFormat}"
                println("${device}Version: $deviceVersion")
                resValue "string", "application_int_version", "${deviceVersion}"

                versionName "${deviceVersion}${rootProject.ext.minor_version}"
                resValue "string", "application_version", versionName

                resValue "string", "application_name", "${apkName}${versionName}"

//                archivesBaseName = "FusionAdaptor" + deviceVersion
                resValue "string", "app_name_display", apkName + " v" + versionName

//                setProperty("archivesBaseName", archivesBaseName)
                android.ext.deviceVersions[device] = deviceVersion
            }
        }

        createDeviceFlavor("pax")

        createDeviceFlavor("ingenico")
    }

    applicationVariants.all { variant ->
        def deviceFlavor = variant.productFlavors.get(0)
        def deviceVersion = android.ext.deviceVersions[deviceFlavor.name]

        variant.outputs.each { output ->
            output.outputFileName = "TerminalPOSDemo_${deviceVersion}-${variant.buildType.name}-${deviceFlavor.name}.apk"
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            shrinkResources false
            debuggable = false
            signingConfig signingConfigs.debug
            if (project.hasProperty("pax")) {
                v2SigningEnabled false
            }
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            shrinkResources false
            signingConfig signingConfigs.debug
            debuggable = true
        }

    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.2.0'
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation "com.squareup.moshi:moshi:1.14.0"
    testImplementation 'junit:junit:4.13.2'

    implementation "com.datameshgroup.fusion:fusion-sdk:2.0.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1"
//    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // Printing utilities
    implementation "com.izettle:html2bitmap:1.10"
    ingenicoImplementation fileTree(include: ['*.jar'], dir: 'libs/ingenico')
    paxImplementation fileTree(include: ['*.jar'], dir: 'libs/pax')

    //added for new FuelProducts page
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.activity:activity-compose:1.5.1'
    implementation 'androidx.compose.ui:ui:1.2.0'
    implementation 'androidx.compose.material:material:1.2.0'
//    implementation "androidx.compose.ui:ui-tooling-preview:1.1.0"
    implementation 'androidx.navigation:navigation-compose:2.5.1'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.2.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.2.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}